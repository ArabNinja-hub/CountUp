name: Build & Deploy GitHub Pages

# Publishes the Vite build to the gh-pages branch, which is what this repo's
# Pages site is configured to serve (Settings -> Pages -> "Deploy from a branch").
# Doing it here instead of by hand means `npm run deploy` can no longer publish a
# stale or locally-tweaked build that the repository cannot reproduce.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the publish on the checks that would otherwise ship a broken site.
      # Any failure in this block stops the workflow, so a red check never ships.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          # Without this, Pages post-processes the build with Jekyll (~80s slower).
          test -f dist/.nojekyll
          # The base path must be baked into the emitted URLs, or Pages renders
          # a blank screen. Assert it rather than trusting the config, and fail
          # loudly if the repo is ever renamed (the base would no longer match).
          grep -q 'src="/CountUp/assets/' dist/index.html
          grep -q '/CountUp/brand/' dist/index.html
          if [ "${GITHUB_REPOSITORY#*/}" != "CountUp" ]; then
            echo "::error::repo is ${GITHUB_REPOSITORY}, but base is hardcoded /CountUp/ — update base-path.ts"
            exit 1
          fi
          echo "Artifact OK:"
          find dist -type f | sort

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Publish dist/ as the gh-pages branch. Done with plain git (rather than a
          # third-party action) so it cannot be blocked by an actions allowlist, and
          # force-pushed because gh-pages is disposable output, never a place for
          # hand edits: the source of truth is main.
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} (build from ${GITHUB_REF_NAME})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
